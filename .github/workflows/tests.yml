name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [10, 11, 12, 13]
        include:
          - php: '8.0'
            laravel: 9
          - php: 8.1
            laravel: 9
          - php: 8.2
            laravel: 9
        exclude:
          - php: 8.1
            laravel: 11
          - php: 8.1
            laravel: 12
          - php: 8.1
            laravel: 13
          - php: 8.2
            laravel: 13
          - php: 8.4
            laravel: 10
          - php: 8.5
            laravel: 10
          - php: 8.5
            laravel: 11

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Remove dev tooling this compatibility matrix doesn't need
        run: composer remove pestphp/pest pestphp/pest-plugin-laravel pestphp/pest-plugin-type-coverage larastan/larastan laravel/pint laravel/pao --dev --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with="illuminate/contracts:^${{ matrix.laravel }}"

      - name: Test Suite
        run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest

    name: Quality (analysis, style, types, arch)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        run: composer test:types

      - name: Architecture Tests
        run: composer test:arch

      - name: Test Suite
        run: composer test:unit
